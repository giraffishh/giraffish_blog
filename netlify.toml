[build]
  command = "npm run build"
  publish = "public"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/:file"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/assets/:file"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.netlify/identity/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/git/*"
  [headers.values]
    Cache-Control = "no-store"

# Only content-addressed bundles are immutable; entry/config files revalidate.
[[headers]]
  for = "/admin/assets/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/assets/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
