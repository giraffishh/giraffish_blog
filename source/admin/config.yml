# 写作工作台配置。保留 Git Gateway 和 editorial_workflow 发布流程。
backend:
  name: git-gateway
  branch: main
  squash_merges: true
local_backend: false
publish_mode: editorial_workflow
media_folder: source/images/uploads
public_folder: /images/uploads
locale: zh_Hans
collections:
  - name: posts
    label: 文章
    folder: source/_posts
    create: true
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 正文
        name: body
        widget: studio-markdown
        required: false
      - label: 发布日期
        name: date
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        required: false
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
        picker_utc: false
      - label: 更新日期
        name: updated
        widget: datetime
        format: YYYY-MM-DD HH:mm:ss
        required: false
        date_format: YYYY-MM-DD
        time_format: HH:mm:ss
        picker_utc: false
        hint: 保存文章时自动更新，使用北京时间。
      - label: 标签
        name: tags
        widget: list
        required: false
      - label: 分类
        name: categories
        widget: list
        required: false
      - label: 关键词
        name: keywords
        widget: list
        required: false
      - label: 摘要
        name: excerpt
        widget: text
        required: false
      - label: 文章封面
        name: index_img
        widget: image-url
        required: false
      - label: 顶部图
        name: banner_img
        widget: image-url
        required: false
      - label: 文章排序
        name: sticky
        widget: number
        required: false
        hint: 数值越大，该文章越靠前
      - label: 永久链接
        name: permalink
        widget: string
        required: false
      - label: 评论
        name: comments
        widget: boolean
        default: true
        required: false
      - name: abbrlink
        label: 文章短链接 ID
        widget: hidden
        required: false
      - name: typora-root-url
        label: Typora 图片根路径
        widget: hidden
        required: false
    label_singular: 文章
    description: 论文批读、课程笔记与技术实践。正文支持即时渲染、源码和可调分屏。
    summary: "{{title}} · {{updated}}"
    sortable_fields:
      - updated
      - date
      - title
    view_groups:
      - label: 分类
        field: categories
      - label: 标签
        field: tags
  - name: pages
    label: 独立页面
    files:
      - file: source/tools/index.md
        name: tools
        label: 工具集
        fields:
          - label: 标题
            name: title
            widget: string
          - label: 内容
            name: body
            widget: studio-markdown
            required: false
          - label: 评论
            name: comments
            widget: boolean
            default: true
            required: false
      - file: source/about/index.md
        name: about
        label: 关于
        fields:
          - label: 标题
            name: title
            widget: string
          - label: 内容
            name: body
            widget: studio-markdown
            required: false
          - label: 评论
            name: comments
            widget: boolean
            default: true
            required: false
  - name: settings
    label: 主题设置
    files:
      - file: source/_data/fluid_config.yml
        name: fluid
        label: fluid主题配置
        editor:
          preview: false
        fields:
          - label: 导航栏
            name: navbar
            widget: object
            collapsed: true
            fields:
              - label: 博客名
                name: blog_title
                widget: string
                required: false
              - label: 毛玻璃特效
                name: ground_glass
                widget: boolean
                default: true
                required: false
          - label: 首页
            name: index
            widget: object
            collapsed: true
            fields:
              - label: 顶部图
                name: banner_img
                widget: image-url
                default: /img/default.png
              - label: 高度
                name: banner_img_height
                widget: number
              - label: 副标题
                name: slogan
                widget: object
                fields:
                  - label: 修改副标题
                    name: text
                    widget: string
                    required: false
          - label: 文章页
            name: post
            widget: object
            collapsed: true
            fields:
              - label: 顶部图(默认)
                name: banner_img
                widget: image-url
                default: /img/default.png
              - label: 高度
                name: banner_img_height
                widget: number
              - label: 文章封面图(默认)
                name: default_index_img
                widget: image-url
          - label: 归档页
            name: archive
            widget: object
            collapsed: true
            fields:
              - label: 顶部图
                name: banner_img
                widget: image-url
                default: /img/default.png
              - label: 高度
                name: banner_img_height
                widget: number
              - label: 副标题
                name: subtitle
                widget: string
                required: false
          - label: 分类页
            name: category
            widget: object
            collapsed: true
            fields:
              - label: 顶部图
                name: banner_img
                widget: image-url
                default: /img/default.png
              - label: 高度
                name: banner_img_height
                widget: number
              - label: 副标题
                name: subtitle
                widget: string
                required: false
          - label: 标签页
            name: tag
            widget: object
            collapsed: true
            fields:
              - label: 顶部图
                name: banner_img
                widget: image-url
                default: /img/default.png
              - label: 高度
                name: banner_img_height
                widget: number
              - label: 副标题
                name: subtitle
                widget: string
                required: false
          - label: 关于页
            name: about
            widget: object
            collapsed: true
            fields:
              - label: 顶部图
                name: banner_img
                widget: image-url
                default: /img/default.png
              - label: 高度
                name: banner_img_height
                widget: number
              - label: 副标题
                name: subtitle
                widget: string
                required: false
              - label: 作者头像
                name: avatar
                widget: image-url
              - label: 博客名称
                name: name
                widget: string
              - label: 网站描述
                name: intro
                widget: string
          - label: 友链页面
            name: links
            widget: object
            collapsed: true
            fields:
              - label: 顶部图
                name: banner_img
                widget: image-url
                default: /img/default.png
              - label: 高度
                name: banner_img_height
                widget: number
              - label: 副标题
                name: subtitle
                widget: string
                required: false
              - label: 添加友链
                name: items
                widget: list
                fields:
                  - label: 网站名称
                    name: title
                    widget: string
                    required: true
                  - label: 网址描述
                    name: intro
                    widget: string
                    required: false
                  - label: 网站地址
                    name: link
                    widget: string
                    required: true
                  - label: 网站头像
                    name: avatar
                    widget: image-url
                    required: true
site_url: https://blog.giraffish.top
display_url: https://blog.giraffish.top
logo_url: https://blog.giraffish.top/img/icons/icon192.png
editor:
  preview: false
show_preview_links: false
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"
